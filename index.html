<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روايتي | RIWAYATI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #d4af37;
  --bg: #101010;
  --panel: #191919;
  --text: #f5f0e5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Cairo, sans-serif;
}
header {
  padding: 18px;
  text-align: center;
  border-bottom: 1px solid #39301c;
}
.logo {
  color: var(--gold);
  font-size: 27px;
  font-weight: bold;
}
header p { color: #aaa; margin: 2px; font-size: 13px; }
main {
  width: min(100% - 24px, 900px);
  margin: 22px auto;
}
.panel {
  background: var(--panel);
  border: 1px solid #34302a;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 16px;
}
input, select, button {
  font: inherit;
}
input, select {
  background: #242424;
  color: white;
  border: 1px solid #51452b;
  border-radius: 8px;
  padding: 10px;
  max-width: 100%;
}
#novelTitle {
  width: 100%;
  font-size: 18px;
  font-weight: bold;
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
button {
  border: 1px solid #675323;
  background: #29251b;
  color: var(--gold);
  padding: 9px 13px;
  border-radius: 8px;
  cursor: pointer;
}
button:active { transform: scale(.97); }
button.primary {
  background: var(--gold);
  color: #17130a;
  font-weight: bold;
}
button.danger {
  border-color: #733b3b;
  color: #ff9999;
}
button:disabled {
  opacity: .35;
  cursor: not-allowed;
}
select { flex: 1; min-width: 125px; }
.size-label { color: #ccc; font-size: 13px; }
#fontSizeValue { color: var(--gold); min-width: 35px; }
.page-area {
  background: #242424;
  border-radius: 12px;
  padding: 15px 8px;
  overflow: hidden;
}
.page {
  width: min(100%, 560px);
  aspect-ratio: 148 / 210;
  margin: auto;
  background: #fffdf7;
  color: #211d18;
  box-shadow: 0 5px 25px #0008;
  position: relative;
  padding: 11% 10%;
  display: flex;
  flex-direction: column;
}
.page-heading {
  text-align: center;
  color: #8b7135;
  font-size: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid #e7dfcc;
  margin-bottom: 12px;
}
#editor {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  outline: none;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.9;
  font-family: Amiri, serif;
  font-size: 20px;
  text-align: right;
  color: #211d18;
}
#editor:empty:before {
  content: "ابدأ كتابة روايتك هنا...";
  color: #aaa;
}
.page-footer {
  text-align: center;
  color: #9a8b6b;
  font-size: 11px;
  padding-top: 8px;
}
.page-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 15px;
  flex-wrap: wrap;
}
#pageNumber {
  color: var(--gold);
  font-weight: bold;
}
.status {
  color: #aaa;
  font-size: 12px;
  text-align: center;
  margin-top: 12px;
}
.hint {
  color: #aaa;
  font-size: 12px;
  line-height: 1.8;
}
@media (max-width: 480px) {
  main { width: calc(100% - 16px); margin-top: 12px; }
  .panel { padding: 10px; }
  .page-area { padding: 8px 3px; }
  .page { padding: 10% 8%; }
  #editor { font-size: 18px; }
  button { padding: 8px 10px; font-size: 13px; }
}
</style>
</head>

<body>
<header>
  <div class="logo">روايتي | RIWAYATI</div>
  <p>مساحتك الخاصة لكتابة الحكايات</p>
</header>

<main>
  <section class="panel">
    <label for="novelTitle">عنوان الرواية</label>
    <input id="novelTitle" placeholder="اكتب عنوان روايتك..." />
  </section>

  <section class="panel">
    <div class="toolbar">
      <select id="fontFamily" aria-label="نوع الخط">
        <option value="Amiri">أميري</option>
        <option value="Noto Naskh Arabic">نسخ عربي</option>
        <option value="Cairo">القاهرة</option>
        <option value="Tajawal">تجوال</option>
        <option value="IBM Plex Sans Arabic">آي بي إم عربي</option>
      </select>

      <button id="smaller" title="تصغير الخط">A−</button>
      <span class="size-label" id="fontSizeValue">20</span>
      <button id="larger" title="تكبير الخط">A+</button>
    </div>

    <div class="toolbar" style="margin-top:10px">
      <button data-align="right">يمين</button>
      <button data-align="center">وسط</button>
      <button data-align="left">يسار</button>
    </div>
  </section>

  <section class="page-area">
    <div class="page">
      <div class="page-heading" id="pageTitle">روايتي</div>
      <div id="editor" contenteditable="true" spellcheck="true"></div>
      <div class="page-footer">RIWAYATI</div>
    </div>

    <div class="page-controls">
      <button id="previous">→ الصفحة السابقة</button>
      <span id="pageNumber">صفحة 1 من 1</span>
      <button id="next">الصفحة التالية ←</button>
    </div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <button class="primary" id="addPage">+ إضافة صفحة</button>
      <button class="danger" id="removePage">− إزالة الصفحة</button>
    </div>
    <p class="hint">
      كل صفحة مستقلة بحجم A5. يمكنك الانتقال بين الصفحات،
      وإضافة صفحات جديدة أو حذف الصفحة الحالية.
    </p>
    <div class="status" id="saveStatus">جاهز للكتابة</div>
  </section>
</main>

<script>
const STORAGE_KEY = "riwayati_a5_editor_v1";

let pages = [{ content: "" }];
let currentPage = 0;
let fontSize = 20;
let fontFamily = "Amiri";
let alignment = "right";
let saveTimer;

const editor = document.getElementById("editor");
const pageNumber = document.getElementById("pageNumber");
const fontSizeValue = document.getElementById("fontSizeValue");
const saveStatus = document.getElementById("saveStatus");
const titleInput = document.getElementById("novelTitle");

function saveData() {
  clearTimeout(saveTimer);
  saveStatus.textContent = "جارٍ الحفظ...";
  saveTimer = setTimeout(() => {
    try {
      pages[currentPage].content = editor.innerHTML;
      const data = {
        pages,
        currentPage,
        fontSize,
        fontFamily,
        alignment,
        title: titleInput.value
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      saveStatus.textContent = "تم الحفظ تلقائياً ✓";
    } catch (error) {
      saveStatus.textContent = "تعذر الحفظ على هذا الجهاز";
    }
  }, 350);
}

function loadData() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && Array.isArray(saved.pages) && saved.pages.length) {
      pages = saved.pages;
      currentPage = Math.min(
        Math.max(0, saved.currentPage || 0),
        pages.length - 1
      );
      fontSize = saved.fontSize || 20;
      fontFamily = saved.fontFamily || "Amiri";
      alignment = saved.alignment || "right";
      titleInput.value = saved.title || "";
    }
  } catch (error) {
    pages = [{ content: "" }];
  }
}

function renderPage() {
  editor.innerHTML = pages[currentPage].content || "";
  editor.style.fontSize = fontSize + "px";
  editor.style.fontFamily = "'" + fontFamily + "', serif";
  editor.style.textAlign = alignment;

  fontSizeValue.textContent = fontSize;
  document.getElementById("fontFamily").value = fontFamily;
  document.getElementById("pageTitle").textContent =
    titleInput.value.trim() || "روايتي";

  pageNumber.textContent =
    "صفحة " + (currentPage + 1) + " من " + pages.length;

  document.getElementById("previous").disabled = currentPage === 0;
  document.getElementById("next").disabled =
    currentPage === pages.length - 1;

  editor.scrollTop = 0;
}

function storeCurrentPage() {
  pages[currentPage].content = editor.innerHTML;
}

function goToPage(index) {
  if (index < 0 || index >= pages.length) return;
  storeCurrentPage();
  currentPage = index;
  renderPage();
  saveData();
}

editor.addEventListener("input", saveData);
titleInput.addEventListener("input", () => {
  document.getElementById("pageTitle").textContent =
    titleInput.value.trim() || "روايتي";
  saveData();
});

document.getElementById("addPage").addEventListener("click", () => {
  storeCurrentPage();
  pages.splice(currentPage + 1, 0, { content: "" });
  currentPage++;
  renderPage();
  saveData();
});

document.getElementById("removePage").addEventListener("click", () => {
  if (pages.length === 1) {
    alert("لا يمكن حذف الصفحة الأخيرة.");
    return;
  }

  if (!confirm("هل أنت متأكد من حذف هذه الصفحة وكل ما كُتب فيها؟")) {
    return;
  }

  pages.splice(currentPage, 1);
  currentPage = Math.min(currentPage, pages.length - 1);
  renderPage();
  saveData();
});

document.getElementById("previous").addEventListener("click", () => {
  goToPage(currentPage - 1);
});

document.getElementById("next").addEventListener("click", () => {
  goToPage(currentPage + 1);
});

document.getElementById("larger").addEventListener("click", () => {
  fontSize = Math.min(40, fontSize + 1);
  renderPage();
  saveData();
});

document.getElementById("smaller").addEventListener("click", () => {
  fontSize = Math.max(12, fontSize - 1);
  renderPage();
  saveData();
});

document.getElementById("fontFamily").addEventListener("change", (event) => {
  fontFamily = event.target.value;
  renderPage();
  saveData();
});

document.querySelectorAll("[data-align]").forEach(button => {
  button.addEventListener("click", () => {
    alignment = button.dataset.align;
    editor.style.textAlign = alignment;
    saveData();
  });
});

loadData();
renderPage();
</script>
</body>
</html>
